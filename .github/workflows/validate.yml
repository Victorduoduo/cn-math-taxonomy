name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests
        run: node tests/test_engine.js
      - name: Children tests
        run: node tests/test_children.js
      - name: Validate data
        run: python3 scripts/validate.py
